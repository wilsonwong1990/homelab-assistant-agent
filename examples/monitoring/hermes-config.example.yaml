# Dedicated read-only Hermes profile. Verify against your installed Hermes release.
# Do not reuse a profile with cloud fallbacks, writable MCPs, hooks, or shell tools.
model:
  provider: custom
  base_url: http://127.0.0.1:11434/v1
  default: qwen3:4b
approvals:
  mode: manual
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
mcp_servers:
  homelab-observer:
    command: /opt/homelab-monitor/.venv/bin/python
    args:
      - -m
      - homelab_monitor
      - --db
      - /var/lib/homelab-monitor/monitor.db
      - mcp
    tools:
      include:
        - homelab_status
        - homelab_incidents
