name: Monitoring tests
on:
  push:
    paths: ["homelab_monitor/**", "tests/**", "examples/monitoring/**", ".github/skills/**", "pyproject.toml", ".github/workflows/monitoring-tests.yml"]
  pull_request:
    paths: ["homelab_monitor/**", "tests/**", "examples/monitoring/**", ".github/skills/**", "pyproject.toml", ".github/workflows/monitoring-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m homelab_monitor --config examples/monitoring/monitoring.example.json validate
