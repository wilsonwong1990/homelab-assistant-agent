[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-monitor"
version = "0.1.0"
description = "Local-first monitoring companion for the portable homelab assistant"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
discord = ["discord.py>=2.4,<3"]

[project.scripts]
homelab-monitor = "homelab_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["homelab_monitor*"]
